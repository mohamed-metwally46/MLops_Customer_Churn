name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      MLFLOW_DISABLE_AGENT_HINT: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install project and verification tools
        run: python -m pip install -e '.[dev,training,analysis]' -c requirements/model-compatibility.in
      - name: Lint
        run: python -m ruff check .
      - name: Format
        run: python -m ruff format --check .
      - name: Offline tests and coverage
        run: python -m pytest -m 'not integration' --basetemp="${{ runner.temp }}/churn-pytest" --cov=churn --cov-report=term-missing
      - name: Dependency consistency
        run: python -m pip check
      - name: Workflow configuration checks
        run: python scripts/validate_ci.py
      - name: Build runtime image
        run: docker build -t churn-api:ci .
      - name: Generate synthetic CI-only model mount
        run: python scripts/prepare_model_bundle.py --synthetic --output models/ci-bundle
      - name: Container parity, failure paths and image audit
        run: python scripts/smoke_docker.py --image churn-api:ci --bundle models/ci-bundle
